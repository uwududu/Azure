
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Speech to Text</title>
    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- Azure Speech SDK oficial -->
    <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
    <style>
        /* Configurações gerais */
        * {
            font-family: "Comic Sans MS", sans-serif;
            font-weight: bold;
        }
        body {
            background-color: #160020;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        /* Card principal */
        .main-card {
            width: 100%;
            max-width: 650px;
            background-color: #280137;
            border: 1px solid #4b1760;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
        }
        /* Título */
        h1 {
            color: #e5b3ff;
            text-align: center;
            margin-bottom: 30px;
        }
        /* Indicador de status */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        .status-circle {
            width: 16px;
            height: 16px;
            background-color: #a83250;
            border-radius: 50%;
            transition: background-color 0.3s;
        }
        .status-circle.listening {
            background-color: #35d07f;
            box-shadow: 0 0 12px #35d07f;
        }
        #statusText {
            font-size: 17px;
            color: #e5d5ed;
        }
        /* Textarea */
        textarea {
            resize: vertical;
            min-height: 220px;
            border-radius: 10px !important;
            background-color: #190024 !important;
            color: #ffffff !important;
            border: 1px solid #603477 !important;
        }
        textarea::placeholder {
            color: #a98bb5;
        }
        textarea:focus {
            border-color: #b00b69 !important;
            box-shadow: 0 0 0 0.2rem rgba(176, 11, 105, 0.25) !important;
        }
        /* Labels */
        .form-label {
            color: #e5d5ed;
        }
        /* Botão iniciar */
        .btn-start {
            background-color: #b00b69;
            color: white;
            border: none;
        }
        .btn-start:hover {
            background-color: #d51b87;
            color: white;
        }
        /* Botão parar */
        .btn-stop {
            background-color: #59206e;
            color: white;
            border: none;
        }
        .btn-stop:hover {
            background-color: #75308e;
            color: white;
        }
        /* Botões desabilitados */
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        /* Texto inferior */
        .info {
            color: #a98bb5;
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
        }
        /* Responsividade */
        @media (max-width: 576px) {
            .main-card {
                padding: 22px;
            }
            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="main-card">
        <!-- Título -->
        <h1>Azure Speech to Text</h1>
        <!-- Indicador de status -->
        <div class="status-container">
            <div id="statusCircle" class="status-circle"></div>
            <span id="statusText">Parado</span>
        </div>
        <!-- Área de texto -->
        <div class="mb-4">
            <label for="recognizedText" class="form-label">
                Texto reconhecido:
            </label>
            <textarea
                id="recognizedText"
                class="form-control"
                placeholder="O texto reconhecido aparecerá aqui..."
                readonly
            ></textarea>
        </div>
        <!-- Botões -->
        <div class="d-flex justify-content-center gap-3">
            <button
                id="startButton"
                class="btn btn-start px-4"
                onclick="iniciarReconhecimento()"
            >
                Iniciar
            </button>
            <button
                id="stopButton"
                class="btn btn-stop px-4"
                onclick="pararReconhecimento()"
                disabled
            >
                Parar
            </button>
        </div>
        <p class="info">
            Reconhecimento de voz utilizando Microsoft Azure Speech Service.
        </p>
    </div>
    <script>
        // ==========================================
        // 1. CONFIGURAÇÕES DO AZURE SPEECH SERVICE
        // ==========================================

        // INSIRA AQUI SUA CHAVE DE ASSINATURA DO AZURE
        const subscriptionKey = "SUA_CHAVE_AZURE";

        // INSIRA AQUI A REGIÃO DO SEU SERVIÇO AZURE
        // Exemplo: "brazilsouth"
        const serviceRegion = "SUA_REGIAO";

        // Idioma do reconhecimento: Português do Brasil
        const language = "pt-BR";

        // ==========================================
        // 2. VARIÁVEIS DO RECONHECIMENTO
        // ==========================================

        let recognizer = null;

        // Armazena somente os resultados definitivos
        let textoFinal = "";

        // Armazena temporariamente o resultado parcial
        let textoParcial = "";

        // Controla se o reconhecimento está ativo
        let estaEscutando = false;


        // ==========================================
        // 3. ELEMENTOS HTML
        // ==========================================

        const statusCircle = document.getElementById("statusCircle");
        const statusText = document.getElementById("statusText");

        const recognizedText = document.getElementById("recognizedText");

        const startButton = document.getElementById("startButton");
        const stopButton = document.getElementById("stopButton");


        // ==========================================
        // 4. CONTROLE VISUAL DO STATUS
        // ==========================================

        function atualizarStatus(escutando) {
            estaEscutando = escutando;
            if (escutando) {
                statusCircle.classList.add("listening");
                statusText.textContent = "Escutando...";
                startButton.disabled = true;
                stopButton.disabled = false;
            } else {
                statusCircle.classList.remove("listening");
                statusText.textContent = "Parado";
                startButton.disabled = false;
                stopButton.disabled = true;
            }
        }

        // ==========================================
        // 5. ATUALIZAÇÃO DO TEXTAREA
        // ==========================================

        function atualizarTexto() {

            // O textarea exibe o texto final acumulado
            // junto com o texto parcial da fala atual.

            recognizedText.value = textoFinal + textoParcial;

            // Mantém o cursor visual no final do texto
            recognizedText.scrollTop = recognizedText.scrollHeight;

        }


        // ==========================================
        // 6. INICIAR RECONHECIMENTO
        // ==========================================

        function iniciarReconhecimento() {

            // Verifica se a chave e a região foram configuradas
            if (
                subscriptionKey === "SUA_CHAVE_AZURE" ||
                serviceRegion === "SUA_REGIAO"
            ) {
                alert("Configure sua chave e região do Azure no código!");
                return;
            }

            // Verifica se o SDK foi carregado
            if (typeof SpeechSDK === "undefined") {
                alert("Não foi possível carregar o Azure Speech SDK.");
                return;
            }

            // Limpa os resultados da sessão anterior
            textoFinal = "";
            textoParcial = "";

            atualizarTexto();

            try {

                // Configurações do serviço Azure
                const speechConfig =
                    SpeechSDK.SpeechConfig.fromSubscription(
                        subscriptionKey,
                        serviceRegion
                    );

                // Define o idioma do reconhecimento
                speechConfig.speechRecognitionLanguage = language;

                // Configura a entrada de áudio pelo microfone
                const audioConfig =
                    SpeechSDK.AudioConfig.fromDefaultMicrophoneInput();

                // Cria o reconhecedor de voz
                recognizer = new SpeechSDK.SpeechRecognizer(
                    speechConfig,
                    audioConfig
                );


                // ==========================================
                // 7. EVENTO RECOGNIZING (RESULTADO PARCIAL)
                // ==========================================

                recognizer.recognizing = function (sender, event) {

                    // Captura o texto provisório da fala atual.
                    // Esse texto NÃO é armazenado permanentemente.

                    textoParcial = event.result.text;

                    atualizarTexto();

                };


                // ==========================================
                // 8. EVENTO RECOGNIZED (RESULTADO FINAL)
                // ==========================================

                recognizer.recognized = function (sender, event) {

                    if (
                        event.result.reason ===
                        SpeechSDK.ResultReason.RecognizedSpeech
                    ) {

                        const novoTexto = event.result.text.trim();

                        // Armazena somente o resultado definitivo.
                        // Cada resultado é adicionado uma única vez.

                        if (novoTexto.length > 0) {
                            if (textoFinal.length > 0) {
                                textoFinal += " ";
                            }
                            textoFinal += novoTexto;
                        }
                    }
                    // Limpa o texto parcial após a confirmação
                    textoParcial = "";

                    atualizarTexto();
                };


                // ==========================================
                // 9. EVENTO CANCELED (ERROS/CANCELAMENTO)
                // ==========================================

                recognizer.canceled = function (sender, event) {

                    console.error(
                        "Reconhecimento cancelado:",
                        event.errorDetails
                    );
                    if (
                        event.reason ===
                        SpeechSDK.CancellationReason.Error
                    ) {
                        alert(
                            "Erro no Azure Speech Service:\n" +
                            event.errorDetails
                        );
                    }
                    finalizarReconhecimento();
                };


                // ==========================================
                // 10. EVENTO SESSION STOPPED
                // ==========================================

                recognizer.sessionStopped = function () {

                    finalizarReconhecimento();

                };


                // ==========================================
                // 11. INÍCIO DO RECONHECIMENTO CONTÍNUO
                // ==========================================

                recognizer.startContinuousRecognitionAsync(

                    function () {

                        // Atualiza os botões e o indicador
                        atualizarStatus(true);
                        console.log(
                            "Reconhecimento iniciado com sucesso!"
                        );
                    },

                    function (error) {
                        console.error(
                            "Erro ao iniciar reconhecimento:",
                            error
                        );
                        alert("Erro ao iniciar: " + error);
                        finalizarReconhecimento();
                    }
                );
            } catch (error) {
                console.error(error);
                alert("Erro na configuração: " + error.message);
                finalizarReconhecimento();
            }
        }

        // ==========================================
        // 12. PARAR RECONHECIMENTO
        // ==========================================

        function pararReconhecimento() {
            if (!recognizer) {
                finalizarReconhecimento();
                return;
            }

            // Solicita ao Azure que encerre o reconhecimento contínuo
            recognizer.stopContinuousRecognitionAsync(
                function () {
                    console.log("Reconhecimento finalizado.");
                    finalizarReconhecimento();
                },
                function (error) {
                    console.error(
                        "Erro ao parar reconhecimento:",
                        error
                    );
                    finalizarReconhecimento();
                }
            );
        }


        // ==========================================
        // 13. FINALIZAR E LIBERAR RECURSOS
        // ==========================================

        function finalizarReconhecimento() {
            atualizarStatus(false);
            textoParcial = "";
            atualizarTexto();
            if (recognizer) {
                recognizer.close();
                recognizer = null;
            }
        }
    </script>
</body>
</html>
