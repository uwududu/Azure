
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Azure Speech to Text</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Azure Speech SDK -->
    <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>

    <style>

        * {
            font-family: "Comic Sans MS", sans-serif;
            font-weight: bold;
        }

        body {
            background-color: #160020;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 650px;
            background-color: #280137;
            border: 1px solid #4b1760;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #e5b3ff;
            text-align: center;
            margin-bottom: 30px;
        }

        h5 {
            color: #e5b3ff;
        }

        .form-label {
            color: #e5d5ed;
        }

        .form-control,
        .form-select {
            background-color: #190024;
            color: white;
            border: 1px solid #603477;
            border-radius: 8px;
        }

        .form-control::placeholder {
            color: #a98bb5;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #190024;
            color: white;
            border-color: #b00b69;
            box-shadow: 0 0 0 0.2rem rgba(176, 11, 105, 0.25);
        }

        .form-select option {
            background-color: #280137;
            color: white;
        }

        .config-section {
            background-color: #21002e;
            border: 1px solid #4b1760;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .status-circle {
            width: 16px;
            height: 16px;
            background-color: #a83250;
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .status-circle.listening {
            background-color: #35d07f;
            box-shadow: 0 0 12px #35d07f;
        }

        #statusText {
            font-size: 17px;
            color: #e5d5ed;
        }

        textarea {
            resize: vertical;
            min-height: 220px;
            border-radius: 10px !important;
        }

        .btn-start {
            background-color: #b00b69;
            color: white;
            border: none;
        }

        .btn-start:hover {
            background-color: #d51b87;
            color: white;
        }

        .btn-stop {
            background-color: #59206e;
            color: white;
            border: none;
        }

        .btn-stop:hover {
            background-color: #75308e;
            color: white;
        }

        .btn-toggle {
            background-color: #59206e;
            color: white;
            border: none;
        }

        .btn-toggle:hover {
            background-color: #75308e;
            color: white;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .info {
            color: #a98bb5;
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
        }

        .config-info {
            color: #a98bb5;
            font-size: 12px;
            margin-top: 12px;
            margin-bottom: 0;
        }

        @media (max-width: 576px) {

            .main-card {
                padding: 22px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

    <div class="main-card">

        <!-- Título -->
        <h1>Azure Speech to Text</h1>


        <!-- ================================= -->
        <!-- CONFIGURAÇÕES DO AZURE -->
        <!-- ================================= -->

        <div class="config-section">

            <h5 class="mb-3">Configurações do Azure</h5>

            <!-- Subscription Key -->
            <div class="mb-3">

                <label for="subscriptionKey" class="form-label">
                    Subscription Key
                </label>

                <div class="input-group">

                    <input
                        type="password"
                        id="subscriptionKey"
                        class="form-control"
                        placeholder="Insira sua chave do Azure"
                        autocomplete="off"
                    >

                    <button
                        class="btn btn-toggle"
                        type="button"
                        onclick="alternarVisibilidade()"
                    >
                        Mostrar
                    </button>

                </div>

            </div>


            <!-- Região -->
            <div class="mb-2">

                <label for="serviceRegion" class="form-label">
                    Região do serviço Azure
                </label>

                <select
                    id="serviceRegion"
                    class="form-select"
                >

                    <option value="">Selecione uma região</option>

                    <option value="brazilsouth">
                        Brazil South
                    </option>

                    <option value="eastus">
                        East US
                    </option>

                    <option value="eastus2">
                        East US 2
                    </option>

                    <option value="westus">
                        West US
                    </option>

                    <option value="westus2">
                        West US 2
                    </option>

                    <option value="westeurope">
                        West Europe
                    </option>

                    <option value="northeurope">
                        North Europe
                    </option>

                    <option value="southeastasia">
                        Southeast Asia
                    </option>

                </select>

            </div>

            <p class="config-info">
                Informe a chave e a região correspondentes ao seu recurso
                Speech no Microsoft Azure.
            </p>

        </div>


        <!-- ================================= -->
        <!-- INDICADOR DE STATUS -->
        <!-- ================================= -->

        <div class="status-container">

            <div
                id="statusCircle"
                class="status-circle"
            ></div>

            <span id="statusText">
                Parado
            </span>

        </div>


        <!-- ================================= -->
        <!-- ÁREA DE TEXTO -->
        <!-- ================================= -->

        <div class="mb-4">

            <label for="recognizedText" class="form-label">
                Texto reconhecido:
            </label>

            <textarea
                id="recognizedText"
                class="form-control"
                placeholder="O texto reconhecido aparecerá aqui..."
                readonly
            ></textarea>

        </div>


        <!-- ================================= -->
        <!-- BOTÕES -->
        <!-- ================================= -->

        <div class="d-flex justify-content-center gap-3">

            <button
                id="startButton"
                class="btn btn-start px-4"
                onclick="iniciarReconhecimento()"
            >
                Iniciar
            </button>

            <button
                id="stopButton"
                class="btn btn-stop px-4"
                onclick="pararReconhecimento()"
                disabled
            >
                Parar
            </button>

        </div>


        <p class="info">
            Reconhecimento de voz utilizando Microsoft Azure Speech Service.
        </p>

    </div>


    <script>

        // ==========================================
        // 1. VARIÁVEIS DO AZURE
        // ==========================================

        let subscriptionKey = "";
        let serviceRegion = "";

        // Idioma do reconhecimento
        const language = "pt-BR";


        // ==========================================
        // 2. VARIÁVEIS DO RECONHECIMENTO
        // ==========================================

        let recognizer = null;

        // Texto definitivo acumulado
        let textoFinal = "";

        // Texto temporário
        let textoParcial = "";

        let estaEscutando = false;


        // ==========================================
        // 3. ELEMENTOS HTML
        // ==========================================

        const statusCircle =
            document.getElementById("statusCircle");

        const statusText =
            document.getElementById("statusText");

        const recognizedText =
            document.getElementById("recognizedText");

        const startButton =
            document.getElementById("startButton");

        const stopButton =
            document.getElementById("stopButton");

        const subscriptionInput =
            document.getElementById("subscriptionKey");

        const regionInput =
            document.getElementById("serviceRegion");


        // ==========================================
        // 4. MOSTRAR OU OCULTAR SUBSCRIPTION KEY
        // ==========================================

        function alternarVisibilidade() {

            const button = document.querySelector(".btn-toggle");

            if (subscriptionInput.type === "password") {

                subscriptionInput.type = "text";

                button.textContent = "Ocultar";

            } else {

                subscriptionInput.type = "password";

                button.textContent = "Mostrar";

            }

        }


        // ==========================================
        // 5. CONTROLE DE STATUS
        // ==========================================

        function atualizarStatus(escutando) {

            estaEscutando = escutando;

            if (escutando) {

                statusCircle.classList.add("listening");

                statusText.textContent = "Escutando...";

                startButton.disabled = true;

                stopButton.disabled = false;

            } else {

                statusCircle.classList.remove("listening");

                statusText.textContent = "Parado";

                startButton.disabled = false;

                stopButton.disabled = true;

            }

        }


        // ==========================================
        // 6. ATUALIZAR TEXTAREA
        // ==========================================

        function atualizarTexto() {

            // Exibe texto definitivo + texto temporário

            recognizedText.value =
                textoFinal + textoParcial;

            recognizedText.scrollTop =
                recognizedText.scrollHeight;

        }


        // ==========================================
        // 7. INICIAR RECONHECIMENTO
        // ==========================================

        function iniciarReconhecimento() {

            // Captura as configurações diretamente do site

            subscriptionKey = subscriptionInput.value.trim();

            serviceRegion = regionInput.value;


            // Validação da chave

            if (!subscriptionKey) {

                alert("Insira sua Subscription Key!");

                subscriptionInput.focus();

                return;

            }


            // Validação da região

            if (!serviceRegion) {

                alert("Selecione uma região do Azure!");

                regionInput.focus();

                return;

            }


            // Verifica se o SDK foi carregado

            if (typeof SpeechSDK === "undefined") {

                alert("Não foi possível carregar o Azure Speech SDK.");

                return;

            }


            // Evita iniciar duas sessões simultaneamente

            if (recognizer || estaEscutando) {
                return;
            }


            // Limpa os textos da sessão anterior

            textoFinal = "";

            textoParcial = "";

            atualizarTexto();


            try {

                // ==========================================
                // CONFIGURAÇÕES DO SERVIÇO AZURE
                // ==========================================

                const speechConfig =
                    SpeechSDK.SpeechConfig.fromSubscription(
                        subscriptionKey,
                        serviceRegion
                    );

                // Define português brasileiro

                speechConfig.speechRecognitionLanguage = language;


                // Configura o microfone

                const audioConfig =
                    SpeechSDK.AudioConfig.fromDefaultMicrophoneInput();


                // Cria o reconhecedor

                recognizer = new SpeechSDK.SpeechRecognizer(
                    speechConfig,
                    audioConfig
                );


                // ==========================================
                // EVENTO RECOGNIZING
                // RESULTADO PARCIAL
                // ==========================================

                recognizer.recognizing = function (sender, event) {

                    // Atualiza o texto temporário.
                    // Não salva permanentemente.

                    textoParcial = event.result.text;

                    atualizarTexto();

                };


                // ==========================================
                // EVENTO RECOGNIZED
                // RESULTADO FINAL
                // ==========================================

                recognizer.recognized = function (sender, event) {

                    if (
                        event.result.reason ===
                        SpeechSDK.ResultReason.RecognizedSpeech
                    ) {

                        const novoTexto = event.result.text.trim();

                        // Acumula somente o resultado definitivo

                        if (novoTexto.length > 0) {

                            if (textoFinal.length > 0) {

                                textoFinal += " ";

                            }

                            textoFinal += novoTexto;

                        }

                    }

                    // Limpa o resultado parcial

                    textoParcial = "";

                    atualizarTexto();

                };


                // ==========================================
                // EVENTO CANCELED
                // ==========================================

                recognizer.canceled = function (sender, event) {

                    console.error(
                        "Reconhecimento cancelado:",
                        event.errorDetails
                    );

                    if (
                        event.reason ===
                        SpeechSDK.CancellationReason.Error
                    ) {

                        alert(
                            "Erro no Azure Speech Service:\n" +
                            event.errorDetails
                        );

                    }

                    finalizarReconhecimento();

                };


                // ==========================================
                // EVENTO SESSION STOPPED
                // ==========================================

                recognizer.sessionStopped = function () {

                    finalizarReconhecimento();

                };


                // ==========================================
                // INÍCIO DO RECONHECIMENTO CONTÍNUO
                // ==========================================

                recognizer.startContinuousRecognitionAsync(

                    function () {

                        atualizarStatus(true);

                        console.log(
                            "Reconhecimento iniciado!"
                        );

                    },

                    function (error) {

                        console.error(error);

                        alert(
                            "Erro ao iniciar reconhecimento: " + error
                        );

                        finalizarReconhecimento();

                    }

                );

            } catch (error) {

                console.error(error);

                alert(
                    "Erro na configuração: " + error.message
                );

                finalizarReconhecimento();

            }

        }


        // ==========================================
        // 8. PARAR RECONHECIMENTO
        // ==========================================

        function pararReconhecimento() {

            if (!recognizer) {

                finalizarReconhecimento();

                return;

            }

            recognizer.stopContinuousRecognitionAsync(

                function () {

                    console.log(
                        "Reconhecimento finalizado."
                    );

                    finalizarReconhecimento();

                },

                function (error) {

                    console.error(error);

                    finalizarReconhecimento();

                }

            );

        }


        // ==========================================
        // 9. FINALIZAR RECONHECIMENTO
        // ==========================================

        function finalizarReconhecimento() {

            atualizarStatus(false);

            textoParcial = "";

            atualizarTexto();

            if (recognizer) {

                recognizer.close();

                recognizer = null;

            }

        }

    </script>

</body>

</html>
